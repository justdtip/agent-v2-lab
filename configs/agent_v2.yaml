# Agent pipeline v2 on a 24 GB M4 Pro: state-carrying notes + observation windowing + QLoRA.
model: qwen25-coder-3b
output: "outputs/agent-v2"
data: "data/agent_v2"
seed: 20260902

# How many recent tool observations stay verbatim in context. Everything older is replaced
# by a one-line stub; the policy's own notes carry the facts forward.
keep_last: 2

# Task counts per split. train mixes clean and recovery variants; valid/test are clean and
# longer-horizon, and are never trained on.
tasks:
  train: 240
  valid: 36
  test: 60

# Chat replay rows from the earlier policy keep ordinary conversation from collapsing.
chat_replay: "data/chat_replay"
chat_repeats: 1

train:
  num_layers: 36
  rank: 16
  scale: 32.0
  dropout: 0.0
  iters: 400
  batch_size: 2
  grad_accumulation_steps: 2
  learning_rate: 3.0e-5
  max_seq_length: 2688
  # Checkpointing on: with it off, batch 2 at 2.7k tokens exceeded Metal memory on the 24 GB M4 Pro.
  grad_checkpoint: true
  val_batches: 24
  steps_per_report: 10
  steps_per_eval: 100
  save_every: 100

select:
  split: valid
  limit: 18

eval:
  split: test
  limit: 60
  max_steps: 24
  max_tokens: 200

rollout:
  limit: 96
  samples: 4
  temperature: 0.7
  keep_per_task: 2
