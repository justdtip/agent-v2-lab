# The unified run, arm A (UNIFIED-RUN-2026-09-06 sections 3 and 4): the agent_v2e source rows
# re-rendered for Qwen3.5-4B (R21 pattern, byte-identical task content), trained on the full
# adapter set (R50(a)) at batch 1 with accumulation 4 (R32), gated-delta chunk 64, gradient
# checkpointing, and a row cap of 3,584 tokens to admit the difficulty-2 training rows whole.
# Projection basis (memo, 11:45): rows average about 1,100 tokens, four rows a step, 126 tokens
# per second measured on 2,688-token rows and 102 on 4,096-token rows, so 400 steps is 4 to 5 hours.
model: qwen35-4b
output: "outputs/agent-v2e-qwen35-4b"
data: "data/agent_v2e-qwen35-4b-cap2688"
source_rows: "data/agent_v2e"
seed: 20260902
keep_last: 2

splits:
  train:  {count: 480, difficulty: 0, perturb: true,  role: train}
  train1: {count: 240, difficulty: 1, perturb: true,  role: train}
  train2: {count: 120, difficulty: 2, perturb: true,  role: train}
  valid:  {count: 24,  difficulty: 1, perturb: false, role: valid}
  valid2: {count: 24,  difficulty: 2, perturb: false, role: valid}
  test:   {count: 180, difficulty: 2, perturb: false, role: test}
  test3:  {count: 60,  difficulty: 3, perturb: false, role: test}

chat_replay: "data/chat_replay"
chat_repeats: 1
recovery_repeats:
  transient: 2
  wrong_path: 2
  unknown_tool: 2
  stale_path: 6
  failed_edit: 6

train:
  rank: 16
  scale: 32.0
  dropout: 0.0
  iters: 400
  batch_size: 1
  grad_accumulation_steps: 4
  learning_rate: 3.0e-5
  max_seq_length: 2688
  gated_delta_chunk: 64
  grad_checkpoint: true
  val_batches: 24
  steps_per_report: 10
  steps_per_eval: 100
  save_every: 100

select:
  screen:
    - {split: valid, difficulty: 1, per_family: {default: 1, long: 3}}
    - {split: valid2, difficulty: 2, per_family: {default: 1, long: 3}}

eval:
  split: test
  limit: 180
  max_steps: 24
  max_tokens: 200

rollout:
  limit: 96
  samples: 4
  temperature: 0.7
  keep_per_task: 2

# UNIFIED-RUN section 4: arm A against the base model, reported with intervals, no threshold.
criteria:
  arm: A
  versus: base
  criterion: reported with intervals; no threshold; coherence-to-completion beside success
