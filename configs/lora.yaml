# Memory-conscious QLoRA defaults for a 24 GB Apple Silicon Mac.
model: "mlx-community/Qwen3-0.6B-4bit"
train: true
fine_tune_type: lora
optimizer: adamw
data: "data/sft"
seed: 42

num_layers: 8
batch_size: 1
grad_accumulation_steps: 4
iters: 100
learning_rate: 2.0e-5
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true

val_batches: -1
steps_per_report: 5
steps_per_eval: 25
save_every: 50
adapter_path: "outputs/sft/adapters"
test: true
test_batches: -1

lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 20.0
  dropout: 0.0

