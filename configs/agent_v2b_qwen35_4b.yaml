# Run B recipe on the Qwen3.5-4B base; only model, output, and data location differ from
# agent_v2b.yaml. R21: the dataset is run B's rows re-rendered for this model's template
# (stage_data delegates to render via source_rows); it is never regenerated, because run B's
# generator revision is unrecoverable and regeneration would break the controlled comparison.
model: qwen35-4b
output: "outputs/agent-v2b-qwen35-4b"
data: "data/agent_v2b-qwen35-4b"
source_rows: "data/agent_v2b"
seed: 20260902

keep_last: 2

tasks:
  train: 240
  valid: 36
  test: 60

chat_replay: "data/chat_replay"
chat_repeats: 1

recovery_repeats:
  transient: 1
  wrong_path: 2
  unknown_tool: 2
  stale_path: 6
  failed_edit: 6

train:
  num_layers: 36
  rank: 16
  scale: 32.0
  dropout: 0.0
  iters: 400
  batch_size: 2
  grad_accumulation_steps: 2
  learning_rate: 3.0e-5
  max_seq_length: 3200  # raised from 2688 on the Director's word (2026-09-05): no train or valid row exceeds 2688 under the Qwen3.5 tokenizer, but 15 test rows do (max 3103) and the loader read them eagerly; training-invariant by measurement, see issue #18
  grad_checkpoint: true
  val_batches: 24
  steps_per_report: 10
  steps_per_eval: 100
  save_every: 100

select:
  screen:
    - {split: valid, difficulty: 1, per_family: {default: 1, long: 3}}
    - {split: valid2, difficulty: 2, per_family: {default: 1, long: 3}}

eval:
  split: test
  limit: 60
  max_steps: 24
  max_tokens: 200

rollout:
  limit: 96
  samples: 4
  temperature: 0.7
  keep_per_task: 2

# R15 condition 5: the SPEC-003 §5 pre-registered success criterion for this arm, recorded
# here before the run and never used for selection (recorded, not gated).
criteria:
  arm: B4
  versus: B
  criterion: >-
    total higher than run B with McNemar p < 0.05 on paired task ids, or a family-level gain
    of at least five in one long-horizon family with no loss elsewhere
