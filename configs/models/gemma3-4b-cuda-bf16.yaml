# The CUDA/PyTorch entry for Gemma 3 4B in bf16 (plan §8.2, §13.2). One registry ENTRY per
# artefact, never a backend field: identity is `base` + `training`, `load_model_spec` matches on
# `hf_id`, and one entry naming two artefacts would change the `registry_sha256` committed in
# records. This is a copy of `gemma3-4b-bf16.yaml` whose `hf_id` is the upstream HF repo id rather
# than a local MLX conversion; `_resolve_checkpoint` leaves it alone because it does not start with
# `models/`. The other fields are inherited verbatim and two of them are provisional here:
# `memory.budget_gib` is a unified-memory number and is re-measured per device (plan §10.2), and
# `cache.strategy: none` is the only strategy the golden records exercised.
name: gemma3-4b-cuda-bf16
# The torch path's entry: Google's official multimodal snapshot, `google/gemma-3-4b-it`, read from
# the HF cache in the primary checkout (no download; `hf_text.load_text_causal_lm` loads its text
# tower and leaves the vision tower behind, failing closed on every other gap). It is a wrapper
# checkpoint: `model_type: gemma3`, `text_config.model_type: gemma3_text`, 444 text tensors under
# `language_model.` beside 439 vision and projector tensors, `__metadata__: {format: pt}`. The
# repository's own conversions (`models/gemma-3-4b-it-bf16`, `-4bit`) carry `format: mlx` and are
# refused by the torch loader by name: they are the MLX entries' checkpoints, not this one's. The
# same bf16 tensors underlie both, which is why the MLX golden records correspond to this entry.
# This comment replaced one inherited verbatim from the MLX bf16 entry, which made three claims
# that were false of the snapshot (SWE-2, 2026-09-09).
hf_id: google/gemma-3-4b-it
# The model these weights are, as opposed to `hf_id`, which is where they live. Both Gemma
# entries are conversions of one upstream model at two precisions, and a Jacobian lens is fitted
# on a model rather than on a file — so the lens identity check compares this and not the path.
base: google/gemma-3-4b-it
# No further training: this is the base checkpoint itself, converted. Stated rather than omitted,
# because a lens fitted on a base and read against a trained checkpoint of the same base is a
# different reading and the identity has to be able to say so (R57).
training_lineage: {}
family: gemma3
chat:
  thinking: "unsupported"
  template_kwargs: {}
  # What the template emits under `add_generation_prompt`; asserted by protocol.build_prompt.
  generation_prefix: "<start_of_turn>model\n"
  # PROVISIONAL, for reading only (the Chief's ruling of 2026-09-08). Gemma's template has no
  # tool role and enforces user/model alternation with an explicit raise, so an observation stops
  # the render. Re-roling keeps a base-model reading inside the model's own distribution; it
  # reverts to provisional the day anyone builds a supervised target here, and every run's
  # manifest says which role it used.
  observation_role: "user"
  # How the observation says what it is, since the `user` role cannot.
  #
  # This was Qwen's bare `<tool_response>` wrapper, chosen so that the two panels of the pilot's
  # comparison differed in the model and not in what their prompts said. The Director's ruling of
  # 2026-09-08 overrides that choice, and it is the stronger argument: *observations should render
  # in a manner that teaches the model to understand what it is doing; a model executing a tool
  # should not assume that in doing so it responds to the user.* Matching Qwen's wrapper kept the
  # comparison tidy by rendering Gemma's episodes in a way that misdescribes them.
  #
  # So the wrapper now names the call it answers. `{name}` is the tool the model itself just
  # invoked, which is precisely the relation the `tool` role used to carry and the one a bare
  # wrapper leaves the model to guess. The cost is real and is recorded rather than avoided: the
  # two panels no longer render observations identically, so a difference between them is no
  # longer attributable to the model alone.
  observation_template: "<tool_response tool=\"{name}\">\n{content}\n</tool_response>"
  # What the prompt tells the model the format is doing to it. The wrapper marks each observation;
  # this gives the model the key to the mark, and neither works without the other.
  #
  # Gemma's template renders an episode as a strict two-party conversation — user, model, user,
  # model — so every tool call the model makes is followed by what the format calls a user turn.
  # Unaided, the model is taught turn after turn that a person answers its actions, and a model
  # that believes that behaves conversationally: it re-acknowledges, re-reads and restates rather
  # than executing a plan. Stage one's transcripts have exactly that shape, including one episode
  # that re-read a missing file four times in twelve turns without ever trying the path its own
  # search had returned.
  observation_convention: |
    Tool results in this chat format: this format has no separate role for tool results, so a
    result reaches you in a turn the format marks as the user's. A turn wrapped in
    <tool_response> is not the user speaking. It is the workspace reporting what your own last
    tool call returned. Read it as the result of your action and continue your task rather than
    replying to it.
  end_of_turn: "<end_of_turn>"
  extra_stop_tokens: []
lora:
  keys: auto
  rank: 16
  scale: 32.0
  dropout: 0.0
train:
  # UNRULED, and training on Gemma stays deferred under the Director's ruling of 2026-09-08.
  # These exist so no consumer meets a bare key error; they are the Qwen recipe's values and are
  # evidence about a different model.
  max_seq_length: 2688
  batch_size: 1
  grad_accumulation_steps: 1
  learning_rate: 3.0e-5
  grad_checkpoint: true
cache:
  # `none` for the first runs: 29 of the 34 per-block caches rotate and no equivalence has been
  # measured on this model. A reuse strategy is an equivalence claim. UNRULED.
  strategy: none
  equivalence_verified: null
probes:
  layer_fractions: [0.167, 0.333, 0.5, 0.667, 0.833, 1.0]
  capture_dtype: native
  # What a lens for this entry must have been fitted in, and it is not the capture's dtype above.
  # WS-D order, "The width rows" (9380e74): in bfloat16 the autograd directional derivative moves
  # by a median 76% at layer 1 when only the forward's batch width changes, against 1e-5 in
  # float32 -- so there is no width-independent bfloat16 Jacobian at these layers and a bf16 map
  # is a derivative of the rounding structure as much as of the model. Lenses are fitted in
  # float32 from here; captures stay native at width 1, being readings of the deployed
  # computation, and a float32 lens read against a native capture carries the path difference as
  # a declared term rather than as agreement.
  lens_fit_dtype: float32
memory:
  budget_gib: 22
policies: {}
